<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffd98a" stroke-width="1" stroke-opacity="0.5"/>
  <!-- 12 house spokes -->
  <g stroke="#ffd98a" stroke-opacity="0.4" stroke-width="0.7">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
    <line x1="16.4" y1="16.4" x2="47.6" y2="47.6"/>
    <line x1="47.6" y1="16.4" x2="16.4" y2="47.6"/>
  </g>
  <!-- Moon + sun hub -->
  <circle cx="32" cy="32" r="4" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="2" fill="#fff"/>
  <!-- Hearts as stars -->
  <g fill="#ff77ff">
    <circle cx="46" cy="18" r="1.5"/>
    <circle cx="18" cy="48" r="1.2"/>
    <circle cx="46" cy="48" r="1.2"/>
    <circle cx="18" cy="18" r="1.5"/>
  </g>
</svg>
